{% extends "forms/base_form.html" %}

{% block title %}Create Session{% endblock %}

{% block header %}
    {% include 'ui/child_header.html' %}
{% endblock %}

{% block form_content %}
    <div class="mb-10">
        <h1 class="text-4xl font-bold">Report Summary</h1>
    </div>

    <form method="post" enctype="multipart/form-data" action="{% url 'tutor:create_report_summary_step' child.id %}">
        {% csrf_token %}

        <div class="bg-gray-200 shadow-md rounded-lg p-5 mb-4 space-y-4">

            <h2 class="text-2xl font-bold">Date Information</h2>
            
            <div class="relative max-w-sm">
                <label class="mb-1 block text-sm font-bold text-gray-700" for="id_from_date">
                    From Date
                </label>
                <div class="absolute inset-y-2 start-0 pt-6 pl-5 flex items-center ps-3 pointer-events-none cursor-pointer">
                    <svg class="w-3 h-3 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                       <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                     </svg>
                </div>
                <input id="id_from_date" name="from_date" datepicker datepicker-autohide type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="First session date of the report" required>
            </div>

            <div class="relative max-w-sm">
                <label class="mb-1 block text-sm font-bold text-gray-700" for="id_to_date">
                    To Date
                </label>
                <div class="absolute inset-y-2 start-0 pt-6 pl-5 flex items-center ps-3 pointer-events-none cursor-pointer">
                    <svg class="w-3 h-3 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                       <path d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z"/>
                     </svg>
                </div>
                <input id="id_to_date" name="to_date" datepicker datepicker-autohide type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5  dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Last session date of the report" required>
            </div>
        
        </div>

        <div class="bg-gray-200 shadow-md rounded-lg p-5 mb-4 space-y-4">

            <h2 class="text-2xl font-bold">Sessions Information</h2>
    
            <div class="relative max-w-sm">
                <label class="mb-1 block text-sm font-bold text-gray-700" for="id_total_sessions_conducted">
                    Total sessions conducted
                </label>
            
                <input id="id_total_sessions_conducted" name="total_sessions_conducted" type="number" required
                    class="form-input w-full py-2" min="1">
            </div>

            <div class="relative max-w-sm">
                <label class="mb-1 block text-sm font-bold text-gray-700" for="id_average_duration_per_session">
                    Average Duration per session (in hours)
                </label>
                <input 
                    id="id_average_duration_per_session" 
                    name="average_duration_per_session" 
                    type="text" 
                    class="form-input w-full py-2 border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" 
                    placeholder="e.g., 01:30:00 (hh:mm:ss)" 
                    pattern="^([0-1]?[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$" 
                    title="Please enter a valid time in the format hh:mm:ss" 
                    required
                />
            </div>
        
        </div>

        <div class="mt-6 space-y-3">
            <button class="btn w-full bg-linear-to-t from-blue-600 to-blue-500 bg-[length:100%_100%] bg-[bottom] text-white shadow-sm hover:bg-[length:100%_150%] cursor-pointer">
                Continue
            </button>
        </div>

    </form>
{% endblock %}
