{% extends 'child/components/general_info/base.html' %}

{% block parent_or_tutor %}
    <!-- Tutor Info -->
    <div class="mt-4">
        {% if child.tutor %}
            <p class="font-bold text-lg text-gray-700">
                <span class="text-blue-600">Tutor:</span> {{ child.tutor.get_full_name }}
            </p>
        {% else %}
            <p class="text-lg text-gray-500 italic">No Tutor Assigned</p>
        {% endif %}
    </div>
{% endblock %}
