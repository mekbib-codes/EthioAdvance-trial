{% load static %}

<div class="bg-gradient-to-r from-blue-50 to-blue-100 p-6 rounded-lg shadow-lg border border-gray-200">
    <div class="flex flex-row items-center space-y-4 md:space-y-0 md:space-x-6">
        <!-- Icon or Avatar -->
        <div class="w-20 h-20 md:w-30 md:h-30 bg-gray-100 rounded-full flex items-center justify-center overflow-hidden border-4 border-blue-200 shadow-md">
            <img src="{% if child.avatar %}{{ child.avatar.url }}{% else %}{% static 'img/default-avatar.png' %} {% endif %}" alt="Child Avatar" class="w-full h-full rounded-full" loading="lazy">
        </div>

        <!-- Child Info -->
        <div class="px-4">
            <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800">{{ child.get_full_name }}</h1>
            <div class="mt-3 space-y-2">
                <p class="text-sm text-gray-600 font-bold flex items-center">
                    Grade: <span class="font-bold text-blue-600 ml-1">{{ child.grade_level }}</span>
                </p>
                <p class="text-sm text-gray-600 font-bold flex items-center">
                    School: <span class="font-bold text-blue-600 ml-1">{{ child.school }}</span>
                </p>
            </div>
        </div>

    </div>

    <!-- Additional Info -->
    <div class="flex flex-col md:flex-row justify-between space-y-4 md:space-y-0 md:space-x-6 mt-4">
        <div class="text-sm text-gray-600 italic font-bold">
            <p>Member Since: {{ child.created_at|date:"M d, Y" }}</p>
            {% block parent_or_tutor %}
            {% endblock %}
        </div>

        <!-- Action Button -->
        <div>
            <a href="{% url 'child:update_profile' child.id %}" class="inline-block bg-blue-600 text-white py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition">
                Update Profile
            </a>
        </div>
    </div>

    
</div>
