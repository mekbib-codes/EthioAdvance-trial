<div class="bg-blue-50 p-6 rounded-lg shadow-lg border border-gray-200">
    <div class="flex items-center space-x-6">
        <!-- Icon or Avatar -->
        <div class="flex-shrink-0">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center">
                <svg class="w-10 h-10 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-3.31 0-6 2.69-6 6v1h12v-1c0-3.31-2.69-6-6-6z" />
                </svg>
            </div>
        </div>

        <!-- Parent Info -->
        <div class="">
            <h1 class="text-2xl font-extrabold text-gray-800">{{ child.get_full_name }}</h1>
            <div class="mt-3">
                <p class="text-sm text-gray-600 font-bold">Grade: <span class="font-bold text-blue-600">{{ child.grade_level }}</span></p>
                <p class="text-sm text-gray-600 font-bold">{{ child.school }}</p>
            </div>
        </div>
    </div>
    {% block parent_or_tutor %}
    {% endblock %}
</div>
