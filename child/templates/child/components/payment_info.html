{% load humanize %}


<div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100 mt-4">
    <h3 class="text-lg font-semibold text-gray-800 mb-3 flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-purple-500" viewBox="0 0 20 20" fill="currentColor">
            <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" />
            <path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd" />
        </svg>
        Payment Information
    </h3>
    
    <div class="space-y-3">
        <!-- Total Due -->
        <div class="bg-purple-50/50 p-3 rounded-lg border border-purple-100 flex items-start">
            <div class="bg-purple-100 text-purple-800 p-2 rounded-lg mr-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                </svg>
            </div>
            <div>
                <p class="text-xs font-medium text-purple-800/80">TOTAL DUE</p>
                <p class="text-lg font-bold text-gray-900">{{ total_due|intcomma }} ETB</p>
            </div>
        </div>

        <div class="bg-emerald-50/50 p-3 rounded-lg border border-emerald-100 flex items-start">
            <div class="bg-emerald-100 text-emerald-800 p-2 rounded-lg mr-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 17a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v12zm5.5-8.5a1 1 0 00-2 0v2.586L5.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L8.5 10.086V8.5z" clip-rule="evenodd" />
                </svg>
            </div>
            <div>
                <p class="text-xs font-medium text-emerald-800/80">TOTAL PAID</p>
                <p class="text-lg font-bold text-gray-900">{{ total_paid|intcomma }} ETB</p>
            </div>
        </div>

        <!-- Unpaid Sessions -->
        <div class="bg-rose-50/50 p-3 rounded-lg border border-rose-100 flex items-start">
            <div class="bg-rose-100 text-rose-800 p-2 rounded-lg mr-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM7 9a1 1 0 100-2 1 1 0 000 2zm7-1a1 1 0 11-2 0 1 1 0 012 0zm-7.536 5.879a1 1 0 001.415 0 3 3 0 014.242 0 1 1 0 001.415-1.415 5 5 0 00-7.072 0 1 1 0 000 1.415z" clip-rule="evenodd" />
                </svg>
            </div>
            <div>
                <p class="text-xs font-medium text-rose-800/80">UNPAID SESSIONS</p>
                <p class="text-lg font-bold text-gray-900">
                    {% if unpaid_sessions %}
                        {{ unpaid_sessions.count }}
                    {% else %}
                        0
                    {% endif %}
                </p>
            </div>
        </div>

        <!-- Pay Now Button (Conditional) -->
        {% if unpaid_sessions and unpaid_sessions.count > 0 %}
        <div class="pt-2">
            <a href="#" class="w-full flex items-center justify-center bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z" />
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.511-1.31c-.563-.649-1.413-1.076-2.354-1.253V5z" clip-rule="evenodd" />
                </svg>
                Pay Now
            </a>
        </div>
        {% endif %}
    </div>
</div>
