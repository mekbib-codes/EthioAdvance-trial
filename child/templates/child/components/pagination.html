<div class="flex justify-center my-8 space-x-2">
    {% if page_obj.has_previous %}
        <a href="?page=1" class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition duration-300">&laquo; First</a>
        <a href="?page={{ page_obj.previous_page_number }}" class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition duration-300">Prev</a>
    {% endif %}

    <span class="px-4 py-2 bg-gray-100 text-blue-500 font-semibold rounded-lg shadow">
        Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition duration-300">Next</a>
        <a href="?page={{ page_obj.paginator.num_pages }}" class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow hover:bg-blue-600 transition duration-300">Last &raquo;</a>
    {% endif %}
</div>
