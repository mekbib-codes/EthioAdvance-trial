<div class="bg-white rounded-xl shadow-sm p-5 border border-gray-100">
    <h3 class="text-lg font-semibold text-gray-800 mb-3 flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
        </svg>
        Unpaid Sessions Summary
    </h3>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <!-- Total Sessions -->
        <div class="bg-blue-50/50 p-2 rounded-lg border border-blue-100 flex items-start">
            <div class="bg-blue-100 text-blue-800 p-1 rounded-lg mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" />
                    <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="text-xs font-bold ">
                <p class="text-blue-800/80">TOTAL - {{ total_sessions }}</p>
                <p class="text-gray-900">Dur. {{ total_duration }}</p>
            </div>
        </div>

        <!-- Pending Sessions -->
        <div class="bg-amber-50/50 p-2 rounded-lg border border-amber-100 flex items-start">
            <div class="bg-amber-100 text-amber-800 p-1 rounded-lg mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="text-xs font-bold ">
                <p class="text-amber-800/80">PENDING - {{ pending_sessions }}</p>
                <p class="text-gray-900">Dur. {{ total_pending_duration }}</p>
            </div>
        </div>

        <!-- Approved Sessions -->
        <div class="bg-green-50/50 p-2 rounded-lg border border-green-100 flex items-start">
            <div class="bg-green-100 text-green-800 p-1 rounded-lg mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="text-xs font-bold">
                <p class="text-green-800/80">APPROVED - {{ approved_sessions }}</p>
                <p class="text-gray-900">Dur. {{ total_approved_duration }}</p>
            </div>
        </div>

        <!-- Rejected Sessions -->
        <div class="bg-red-50/50 p-2 rounded-lg border border-red-100 flex items-start">
            <div class="bg-red-100 text-red-800 p-1 rounded-lg mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="text-xs font-bold">
                <p class="text-red-800/80">REJECTED - {{ rejected_sessions }}</p>
                <p class="text-gray-900">Dur. {{ total_rejected_duration }}</p>
            </div>
        </div>
    </div>
</div>
