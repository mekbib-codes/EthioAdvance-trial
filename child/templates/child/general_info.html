<div class="bg-blue-50 p-6 rounded-lg shadow-md">
    <div class="flex items-center space-x-4">
        <!-- Icon or Avatar -->
        <div class="flex-shrink-0">
            <div class="w-16 h-16 bg-blue-200 rounded-full flex items-center justify-center">
                <svg class="w-8 h-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A4.992 4.992 0 015 15V9a5 5 0 0110 0v6a4.992 4.992 0 01-.121 2.804M15 19a3 3 0 11-6 0" />
                </svg>
            </div>
        </div>

        <!-- Child Info -->
        <div>
            <h1 class="text-3xl font-bold text-blue-600">{{ child.get_full_name }}</h1>
            <p class="text-lg text-gray-700">{{ child.age }} Years Old</p>
            <p class="text-lg text-gray-700">{{ child.school }}</p>
            <p class="text-lg text-gray-700">Grade: {{ child.grade_level }}</p>
        </div>
    </div>

    <!-- Tutor Info -->
    <div class="mt-4">
        {% if child.tutor %}
            <p class="text-lg text-gray-700">
                <span class="font-semibold text-blue-600">Tutor:</span> {{ child.tutor.get_full_name }}
            </p>
        {% else %}
            <p class="text-lg text-gray-500 italic">No Tutor Assigned</p>
        {% endif %}
    </div>
</div>
