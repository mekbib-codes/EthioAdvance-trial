<div id="report-{{ report.id }}-container" class="p-4 bg-blue-50 shadow-md rounded-lg text-gray-700 space-y-4">
    <!-- Header -->

    {% if report.feedback %}
        <div id="feedback-display" class="flex items-center space-x-2 text-green-700 bg-transparent p-2">
            <svg class="w-5 h-5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            <span class="italic">Feedback has been sent! Thank you for helping us improve your child’s learning journey.</span>
        </div>
    
    {% else %}
        <h2 class="font-bold text-2xl text-blue-600">Feedback</h2>
        <!-- Feedback Form -->
        <form 
            hx-post="{% url 'parent:add_report_feedback' report.id %}" 
            hx-target="#report-{{ report.id }}-container" 
            hx-swap="outerHTML"
            hx-on="htmx:beforeRequest: this.classList.add('fade-out')"
            class="flex flex-col space-y-4 bg-white p-4 rounded-lg shadow"
        >
            <label for="feedback" class="text-lg font-semibold text-gray-700">Add Feedback:</label>
            <textarea 
                name="parent_feedback" 
                id="feedback" 
                rows="5" 
                class="p-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Write your feedback here..."
                required
            ></textarea>

            <!-- Buttons -->
            <div class="flex justify-between mt-4">
                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="px-6 py-2 bg-gradient-to-r from-green-400 to-green-600 text-white font-semibold rounded-full shadow-lg hover:from-green-500 hover:to-green-700 hover:shadow-xl transition-transform duration-300 transform hover:scale-105 cursor-pointer"
                >
                    Submit
                </button>

                <!-- Reset Button -->
                <button 
                    type="reset" 
                    class="px-6 py-2 bg-gradient-to-r from-red-400 to-red-600 text-white font-semibold rounded-full shadow-lg hover:from-red-500 hover:to-red-700 hover:shadow-xl transition-transform duration-300 transform hover:scale-105 cursor-pointer"
                >
                    Cancel
                </button>
            </div>
        </form>
    {% endif %}
</div>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
    #feedback-display {
        animation: fadeIn 0.5s ease-out;
    }

    .fade-out {
    animation: fadeOut 0.5s forwards;
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

</style>
