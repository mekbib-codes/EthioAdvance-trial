{% load static %}

<div class="bg-gradient-to-r from-blue-50 to-blue-100 p-6 rounded-lg shadow-lg border border-gray-200">
    <div class="flex flex-row items-center space-y-4 md:space-y-0 md:space-x-6">
        <!-- Icon or Avatar -->
        <div class="w-20 h-20 md:w-30 md:h-30 bg-gray-100 rounded-full flex items-center justify-center overflow-hidden border-4 border-blue-200 shadow-md">
            
                <img src="{% if profile_image %}{{ profile_image }}{% else %}{% static 'img/default-avatar.png' %} {% endif %}" alt="Parent Avatar" class="w-full h-full rounded-full" loading="lazy">
        </div>

        <!-- Parent Info -->
        <div class="px-4">
            <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800">{{ parent.get_full_name }}</h1>
            <div class="mt-3 space-y-2">
                <p class="text-sm text-gray-600 font-bold flex items-center">
                    Enrolled Children: <span class="font-bold text-blue-600 ml-1">{{ total_children }}</span>
                </p>
                <p class="text-sm text-gray-600 font-bold flex items-center">
                    Total Sessions: <span class="font-bold text-blue-600 ml-1">{{ total_sessions }}</span>
                </p>
            </div>
        </div>
    </div>

    <!-- Additional Info -->
    <div class="flex flex-col md:flex-row justify-between space-y-4 md:space-y-0 md:space-x-6 mt-4">
        <div class="text-sm text-gray-600 italic font-bold">
            <p>Member Since: {{ parent.date_joined|date:"M d, Y" }}</p>
            <p>Last Login: {{ parent.last_login|date:"M d, Y" }}</p>
        </div>

        <!-- Action Button -->
        <div>
            <a href="{% url 'parent:update_profile' %}" class="inline-block bg-blue-600 text-white py-2 px-4 rounded-lg shadow-md hover:bg-blue-700 transition">
                Update Profile
            </a>
        </div>
    </div>
</div>
