{% load humanize %}

<div class="bg-white rounded-2xl shadow-lg m-4 p-6 flex flex-col justify-between h-full transform transition-all hover:shadow-xl duration-300">
    <div>
        <h2 class="text-center text-3xl text-blue-500 font-bold mb-6 relative">
            <span class="relative inline-block">
                Recent Activities
                <span class="absolute -bottom-1 left-0 w-full h-1 bg-blue-100 rounded-full"></span>
                <span class="absolute -bottom-1 left-0 w-1/3 h-1 bg-blue-500 rounded-full animate-pulse"></span>
            </span>
        </h2>
        
        <div class="space-y-3">
            <ul class="divide-y divide-gray-200/50">
            {% for activity in activities %}
                <li class="py-3 hover:scale-[1.01] hover:bg-blue-50/50 rounded-lg transition-all duration-200 ease-out group">
                    <a href="{{ activity.link }}" class="flex items-start space-x-3">
                        <!-- Animated activity indicator -->
                        <span class="relative flex h-3 w-3 mt-1.5 flex-shrink-0">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75 group-hover:opacity-100"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500 group-hover:bg-blue-600"></span>
                        </span>
                        
                        <!-- Activity content -->
                        <div class="flex-1 min-w-0">
                            <p class="text-gray-700 group-hover:text-blue-600 transition-colors font-medium">
                                {{ activity.action }}
                            </p>
                            <div class="flex items-center mt-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-gray-400 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span class="text-xs text-gray-500 group-hover:text-gray-600 transition-colors">
                                    {{ activity.created_at|naturaltime }}
                                </span>
                            </div>
                        </div>
                        
                        <!-- Interactive arrow -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-300 group-hover:text-blue-400 transition-colors flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </a>
                </li>
            {% endfor %}
            </ul>
        </div>
    </div>
</div>
