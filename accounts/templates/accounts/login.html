{% extends "base.html" %}

{% block header %}
    {% include "ui/accounts_header.html" %}
{% endblock %}

{% block content %}
    <main class="relative grow">

        <div class="pointer-events-none absolute bottom-0 left-0 -translate-x-1/3" aria-hidden="true">
          <div class="h-80 w-80 rounded-full bg-linear-to-tr from-blue-500 opacity-70 blur-[160px]"></div>
        </div>

        <div class="w-full">
            <div class="flex h-full flex-col justify-center before:min-h-[4rem] before:flex-1 after:flex-1 md:before:min-h-[5rem]">
              <div class="px-4 sm:px-6">
                <div class="mx-auto w-full max-w-md">
                  <div class="py-16 md:py-20">
                    
                        {% include 'forms/login_form.html' %}

                        <div class="my-6 text-left">
                            <a 
                                class="text-md font-bold text-gray-700 hover:text-blue-500" 
                                href="#">
                                Forgot password
                            </a>
                        </div>


                  </div>

                  
                </div>

                <section>
                    <div class="mx-auto max-w-6xl px-4 sm:px-6">
                        <div class="relative overflow-hidden rounded-2xl text-center shadow-xl before:pointer-events-none before:absolute before:inset-0 before:-z-10 before:rounded-2xl before:bg-gray-900">
                            
                            {% include "components/cta/cta.html" with text="Don't have an account?" %}
                            
                        </div>
                    </div>
                </section>

              </div>
        </div>

    </main>
{% endblock %}
