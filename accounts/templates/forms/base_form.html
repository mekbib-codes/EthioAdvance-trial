{% extends "base.html" %}

{% block header %}
    {% include "ui/accounts_header.html" %}
{% endblock %}

{% block content %}
    <main class="relative grow">

        <div class="pointer-events-none absolute bottom-0 left-0 -translate-x-1/3" aria-hidden="true">
          <div class="h-80 w-80 rounded-full bg-linear-to-tr from-blue-500 opacity-70 blur-[160px]"></div>
        </div>

        <div class="w-full">
            <div class="flex h-full flex-col justify-center before:min-h-[4rem] before:flex-1 after:flex-1 md:before:min-h-[5rem]">
              <div class="px-4 sm:px-6">
                <div class="mx-auto w-full max-w-md">
                  <div class="py-16 md:py-20">
                    
                        {% block form_content %}
                        {% endblock %}
                  </div>

                  
                </div>

                {% block cta %}
                {% endblock %}

              </div>
        </div>

    </main>
{% endblock %}

{% block scripts %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
          // Select all password input fields
          const passwordFields = document.querySelectorAll('input[type="password"]');
          
          // SVG icons markup
          const eyeIcon = `
              <svg class="eye-icon h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>`;
          
          const eyeSlashIcon = `
              <svg class="eye-slash-icon h-5 w-5 text-gray-500 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>`;

          // Process each password field
          passwordFields.forEach(function(field) {
              // Create container for the input and icons
              const container = document.createElement('div');
              container.className = 'relative';
              
              // Wrap the input in the container
              field.parentNode.insertBefore(container, field);
              container.appendChild(field);
              
              // Add right padding to the input
              field.classList.add('pr-10');
              
              // Create icons container
              const iconsContainer = document.createElement('div');
              iconsContainer.className = 'absolute px-5 py-2.5 right-0 top-0 cursor-pointer';
              
              // Add icons to container
              iconsContainer.innerHTML = eyeIcon + eyeSlashIcon;
              container.appendChild(iconsContainer);
              
              // Get references to the icons
              const eye = iconsContainer.querySelector('.eye-icon');
              const eyeSlash = iconsContainer.querySelector('.eye-slash-icon');
              
              // Add click handlers
              iconsContainer.addEventListener('click', function() {
                  if (field.type === 'password') {
                      field.type = 'text';
                      eye.classList.add('hidden');
                      eyeSlash.classList.remove('hidden');
                  } else {
                      field.type = 'password';
                      eyeSlash.classList.add('hidden');
                      eye.classList.remove('hidden');
                  }
              });
          });
        });
    </script>
{% endblock %}
