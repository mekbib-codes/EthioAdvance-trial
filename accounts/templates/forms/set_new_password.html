{% extends "forms/base_form.html" %}

{% block form_content %}
    <div class="mb-10">
        <h1 class="text-4xl font-bold">Reset Your Password</h1>
    </div>

    <form method="post" action="{% url 'accounts:set_new_password' %}" class="space-y-6">
    {% csrf_token %}

        {% include "forms/passwords.html" with header="Set a new password" %}

        <div class="mt-6">
            <button class="btn w-full bg-linear-to-t from-blue-600 to-blue-500 bg-[length:100%_100%] bg-[bottom] text-white shadow-sm hover:bg-[length:100%_150%] cursor-pointer" type="submit">
            Reset Password
            </button>
        </div>
    </form>
{% endblock %}
