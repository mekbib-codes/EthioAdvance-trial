{% load static %}

<!-- Glow -->
<div class="absolute bottom-0 left-1/2 -z-10 -translate-x-1/2 translate-y-1/2" aria-hidden="true">
    <div class="h-56 w-[480px] rounded-full border-[20px] border-blue-500 blur-3xl"></div>
</div>

<!-- Stripes Background -->
<div class="pointer-events-none absolute left-1/2 top-0 -z-10 -translate-x-1/2 transform" aria-hidden="true">
    <img class="max-w-none" src="{% static 'img/stripes/stripes-dark.svg' %}" width="768"  height="432" alt="Stripes"/>
</div>

<div class="px-4 py-12 md:px-12 md:py-20">
    <h2 class="mb-6 border-y border-transparent text-3xl font-bold text-gray-200 
        md:mb-12 md:text-4xl"
        style="border-image: linear-gradient(to right, transparent, rgba(30, 41, 59, 0.7), transparent) 1;">
        {{ text }}
    </h2>

    <div class="mx-auto max-w-xs sm:flex sm:max-w-none sm:justify-center">
        <a href="#0" class="btn group mb-4 w-full bg-gradient-to-t from-blue-600 to-blue-500 
            bg-[length:100%_100%] bg-[bottom] text-white shadow-sm hover:bg-[length:100%_150%] 
            sm:mb-0 sm:w-auto">
            <span class="relative inline-flex items-center">
                Create parent account 
                <span class="ml-1 tracking-normal text-blue-300 transition-transform group-hover:translate-x-0.5">
                    →
                </span>
            </span>
        </a>
    </div>
</div>
