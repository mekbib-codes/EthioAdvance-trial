<form method="get" class="w-full">
    <div class="flex flex-col sm:flex-row gap-3 items-center">
        <!-- Status Filter  -->
        <select name="status" class="form-select">
            <option value="">All Status</option>
            {% for value, label in status_choices %}
              <option value="{{ value }}" {% if current_status == value %}selected{% endif %}>
                {{ label }}
              </option>
            {% endfor %}
          </select>
        
        <!-- Duration Filter -->
        <select name="duration" class="form-select">
            <option value="">Any Duration</option>
            <option value="1h" {% if current_duration == "1h" %}selected{% endif %}>1h+</option>
            <option value="2h" {% if current_duration == "2h" %}selected{% endif %}>2h+</option>
            <option value="3h" {% if current_duration == "3h" %}selected{% endif %}>3h+</option>
          </select>
        

        <!-- Payment Filter -->
        <label class="form-check-label">
            <input 
              type="checkbox" 
              name="is_paid" 
              class="form-check-input" 
              {% if current_is_paid == "on" %}checked{% endif %}
            > Paid
          </label>

          <label class="form-check-label">
            <input 
              type="checkbox" 
              name="paid_to_tutor" 
              class="form-check-input" 
              {% if current_paid_to_tutor == "on" %}checked{% endif %}
            > Paid To Tutor
          </label>

        <!-- Search Input -->
        <div class="relative w-full sm:w-96">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <input 
                type="text" 
                name="q" 
                value="{{ request.GET.q }}" 
                class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                placeholder="Search children, parents or tutors..."
            >
            {% if request.GET.q %}
            <a href="?{% if request.GET.grade %}grade={{ request.GET.grade }}{% endif %}" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </a>
            {% endif %}
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full sm:w-auto px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            Search
        </button>
    </div>
</form>
