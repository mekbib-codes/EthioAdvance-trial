<form method="get" class="w-full">
    <div class="flex flex-col sm:flex-row gap-3 items-center">
        <!-- Gender Filter  -->
        <div class="w-full sm:w-auto">
            <select name="gender" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                <option value="">Filter by gender</option>
                <option value="MALE" {% if request.GET.gender == 'MALE' %}selected{% endif %}>Male</option>
                <option value="FEMALE" {% if request.GET.gender == 'FEMALE' %}selected{% endif %}>Female</option>
            </select>
        </div>

        <!-- Grade Filter -->
        <div class="w-full sm:w-auto">
            <select name="grade" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                <option value="">Filter by grade</option>
                {% for grade_level in grade_levels %}
                    <option value="{{ grade_level }}" {% if request.GET.grade == grade_level|stringformat:"s" %}selected{% endif %}>
                        Grade {{ grade_level }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Age Filter -->
        <div class="w-full sm:w-auto">
            <select name="age" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                <option value="">Filter by age</option>
                {% for age in age_range %}
                    <option value="{{ age }}" {% if request.GET.age == age|stringformat:"s" %}selected{% endif %}>
                        {{ age }} Years Old
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Search Input -->
        <div class="relative w-full sm:w-96">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <input 
                type="text" 
                name="q" 
                value="{{ request.GET.q }}" 
                class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                placeholder="Search children, parents or tutors..."
            >
            {% if request.GET.q %}
            <a href="?{% if request.GET.grade %}grade={{ request.GET.grade }}{% endif %}" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </a>
            {% endif %}
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full sm:w-auto px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
            Search
        </button>
    </div>
</form>
