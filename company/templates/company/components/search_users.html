<div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
    <!-- Search Results Info -->
    <div class="flex-1 min-w-0">
        {% if is_search and search_query %}
        <p class="text-lg text-gray-600 truncate italic">
            Showing results for: <span class="font-bold text-blue-500">{{ search_query }}</span>
            <a href="{% if ':' in user_list_url %}{% url user_list_url %}{% else %}{{ user_list_url }}{% endif %}" 
               class="ml-8 text-blue-600 hover:text-blue-900 font-bold">
               Clear search
            </a>
        </p>
        {% endif %}
    </div>
    
    <!-- Search Form -->
    <form method="get"  action="{% if ':' in user_search_url %}{% url user_search_url %}{% else %}{{ user_search_url }}{% endif %}"  class="max-w-120 w-full right-0 sm:w-96">
        <div class="relative">
            <input type="text" name="q" value="{{ search_query }}" 
                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                placeholder="Search by first name, last name, email or phone..."
                required>
            <div class="absolute left-3 top-2.5 text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <button type="submit" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-blue-500 hover:text-blue-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </form>
</div>
